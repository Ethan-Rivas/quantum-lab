name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # every Monday: rebuild with the latest library releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build notebook image
        run: docker compose build notebook

      - name: Start QVM and quilc
        run: docker compose up -d qvm quilc

      - name: Smoke test (Qiskit, Cirq, pyQuil via QVM + quilc)
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose run --rm notebook python /opt/quantum-lab/smoke_test.py --require-servers && exit 0
            echo "Servers may still be starting; retrying in 10s ($attempt/5)"
            sleep 10
          done
          exit 1

      - name: Execute starter notebook
        run: |
          docker compose run --rm notebook \
            jupyter nbconvert --to notebook --execute --stdout 00-hello-quantum.ipynb > /dev/null

      - name: Show server logs on failure
        if: failure()
        run: docker compose logs qvm quilc

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; GitHub usernames may not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
