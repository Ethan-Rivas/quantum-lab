# Use the prebuilt image from GitHub Container Registry instead of building locally:
#
#   docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up
#
# Image names must be lowercase, even when the GitHub username isn't.
services:
  notebook:
    image: ghcr.io/ethan-rivas/quantum-lab:latest
    build: !reset null
    pull_policy: missing
